apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.serviceName | default (include "spring-service.name" .) }}
  labels:
    {{- include "spring-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "spring-service.name" . }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
