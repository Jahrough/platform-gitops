apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "spring-service.name" . }}-runtime-config
  labels:
    {{- include "spring-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: {{ include "spring-service.name" . }}-runtime-config
    creationPolicy: Owner
  data:
    {{- range .Values.service.runtimeConfigProperties }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ required "externalSecrets.runtimeConfig.remoteKey is required" $.Values.externalSecrets.runtimeConfig.remoteKey }}
        property: {{ . }}
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "spring-service.name" . }}-cache-auth
  labels:
    {{- include "spring-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: {{ include "spring-service.name" . }}-cache-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: {{ required "externalSecrets.cacheAuth.remoteKey is required" .Values.externalSecrets.cacheAuth.remoteKey }}
        property: {{ .Values.externalSecrets.cacheAuth.property }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "spring-service.name" . }}-db
  labels:
    {{- include "spring-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: {{ include "spring-service.name" . }}-db
    creationPolicy: Owner
  data:
    {{- range .Values.service.database.properties }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ include "spring-service.databaseRemoteKey" $ }}
        property: {{ . }}
    {{- end }}
