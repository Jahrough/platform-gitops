apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spring-service.name" . }}
  labels:
    {{- include "spring-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.service.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "spring-service.name" . }}
  template:
    metadata:
      labels:
        {{- include "spring-service.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "spring-service.name" . }}
          image: "{{ include "spring-service.imageReference" . }}"
          imagePullPolicy: {{ .Values.service.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- range .Values.service.env }}
            - name: {{ .name }}
              {{- if hasKey . "secret" }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "spring-service.envSecretName" (dict "secret" .secret "Values" $.Values) }}
                  key: {{ .key }}
              {{- else }}
              value: {{ .value | quote }}
              {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ .Values.service.httpGet.livenessPath }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.service.httpGet.livenessPath }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.service.httpGet.readinessPath }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
