service:
  name: product-search
  autoscalingMaxReplicas: 10
  ingressSubdomain: search
  port: 8081
  image:
    repository: ghcr.io/jahrough/product-search
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: prod
    - name: SERVER_PORT
      value: "8081"
    - name: REDIS_HOST
      secret: runtime-config
      key: REDIS_HOST
    - name: REDIS_PORT
      secret: runtime-config
      key: REDIS_PORT
    - name: SPRING_DATA_REDIS_PASSWORD
      secret: cache-auth
      key: password
    - name: SPRING_DATA_REDIS_SSL_ENABLED
      value: "true"
    - name: SPRING_DATASOURCE_URL
      secret: database
      key: url
    - name: SPRING_DATASOURCE_USERNAME
      secret: database
      key: username
    - name: SPRING_DATASOURCE_PASSWORD
      secret: database
      key: password
    - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
      secret: runtime-config
      key: KAFKA_BOOTSTRAP_SERVERS
    - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
      value: SSL
    - name: APP_OPENSEARCH_URIS
      secret: runtime-config
      key: OPENSEARCH_URIS
  database:
    properties:
      - url
      - username
      - password
  runtimeConfigProperties:
    - REDIS_HOST
    - REDIS_PORT
    - KAFKA_BOOTSTRAP_SERVERS
    - OPENSEARCH_URIS
  httpGet:
    livenessPath: /actuator/health/liveness
    readinessPath: /actuator/health/readiness

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

networkPolicy:
  egressPorts:
    - 5432
    - 443
    - 6379
    - 9094
