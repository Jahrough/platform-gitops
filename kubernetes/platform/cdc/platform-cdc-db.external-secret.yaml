apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-cdc-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: platform-cdc-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: REPLACE_ME
        property: username
    - secretKey: password
      remoteRef:
        key: REPLACE_ME
        property: password
