apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-runtime-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: platform-runtime-config
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: REPLACE_ME
        property: DB_HOST
    - secretKey: KAFKA_BOOTSTRAP_SERVERS
      remoteRef:
        key: REPLACE_ME
        property: KAFKA_BOOTSTRAP_SERVERS
