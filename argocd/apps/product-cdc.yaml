apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-cdc
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/Jahrough/platform-gitops.git
    targetRevision: main
    path: kubernetes/platform/cdc
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-production
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
