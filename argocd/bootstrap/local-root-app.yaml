apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-local-root
  namespace: argocd
spec:
  project: platform-local-bootstrap
  source:
    repoURL: https://github.com/Jahrough/platform-gitops.git
    targetRevision: main
    path: argocd/local
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
