name: Validate GitOps manifests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0

      - name: Lint chart
        run: |
          helm lint charts/spring-service \
            -f charts/spring-service/values/product-catalog.yaml \
            -f charts/spring-service/values/environments/dev.yaml

      - name: Parse Argo CD, values, and provider manifests
        run: |
          ruby -e '
            require "yaml"
            files = Dir.glob("argocd/**/*.yaml") +
              Dir.glob("charts/spring-service/Chart.yaml") +
              Dir.glob("charts/spring-service/values/**/*.yaml") +
              Dir.glob("kubernetes/**/*.yaml")
            files.each { |file| YAML.load_file(file) }
            puts "Parsed #{files.length} YAML files"
          '

      - name: Render every service and environment
        run: |
          set -euo pipefail
          for service in product-catalog product-search; do
            for environment in dev staging production; do
              namespace="platform-${environment}"
              service_values="charts/spring-service/values/${service}.yaml"
              environment_values="charts/spring-service/values/environments/${environment}.yaml"
              helm template "$service" charts/spring-service \
                --namespace "$namespace" \
                --values "$service_values" \
                --values "$environment_values" \
                > "/tmp/${service}-${environment}.yaml"
            done
          done

      - name: Check production platform resources render
        run: |
          set -euo pipefail
          for service in product-catalog product-search; do
            rendered="/tmp/${service}-production.yaml"
            grep -q '^kind: HorizontalPodAutoscaler$' "$rendered"
            grep -q '^kind: PodDisruptionBudget$' "$rendered"
            grep -q '^kind: NetworkPolicy$' "$rendered"
            if grep -q '^kind: Ingress$' "$rendered"; then
              echo "Unexpected production ingress rendering." >&2
              exit 1
            fi
          done

      - name: Render local service profiles and check cloud isolation
        run: |
          set -euo pipefail
          for service in product-catalog product-search; do
            rendered="/tmp/${service}-local.yaml"
            helm template "$service" charts/spring-service \
              --namespace platform-local \
              --values "charts/spring-service/values/${service}.yaml" \
              --values charts/spring-service/values/environments/local.yaml \
              --values "charts/spring-service/values/local/${service}.yaml" \
              > "$rendered"
            grep -q "ghcr.io/jahrough/${service}:local" "$rendered"
            if grep -Eq '^kind: (ExternalSecret|HorizontalPodAutoscaler|PodDisruptionBudget|NetworkPolicy|Ingress)$' "$rendered"; then
              echo "Cloud-only resource rendered for ${service} local profile." >&2
              exit 1
            fi
          done

      - name: Check local Argo CD project boundaries
        run: |
          ruby -e '
            require "yaml"
            project = YAML.load_file("argocd/local/project.yaml")
            spec = project.fetch("spec")
            abort "Local project has cluster resource permissions" unless spec.fetch("clusterResourceWhitelist") == []
            destinations = spec.fetch("destinations")
            abort "Local project can target a non-local namespace" unless
              destinations == [{"server" => "https://kubernetes.default.svc", "namespace" => "platform-local"}]
            abort "Local project can read an unapproved source" unless
              spec.fetch("sourceRepos") == ["https://github.com/Jahrough/platform-gitops.git"]
            bootstrap = YAML.load_file("argocd/bootstrap/local-bootstrap-project.yaml")
            bootstrap_spec = bootstrap.fetch("spec")
            abort "Local bootstrap project has cluster resource permissions" unless
              bootstrap_spec.fetch("clusterResourceWhitelist") == []
            local_root = YAML.load_file("argocd/bootstrap/local-root-app.yaml")
            root_spec = local_root.fetch("spec")
            abort "Local root does not target the local configuration path" unless
              root_spec.dig("source", "path") == "argocd/local"
            abort "Local root uses the wrong bootstrap project" unless
              root_spec.fetch("project") == "platform-local-bootstrap"
            local_apps = Dir.glob("argocd/local/apps/*.yaml").map { |file| YAML.load_file(file) }
            abort "Expected exactly two local service Applications" unless local_apps.length == 2
            local_apps.each do |app|
              app_spec = app.fetch("spec")
              abort "Local Application targets a non-local namespace" unless
                app_spec.dig("destination", "namespace") == "platform-local"
              abort "Local Application uses an unexpected project" unless
                app_spec.fetch("project") == "platform-local"
              abort "Local Application source differs from the approved repository" unless
                app_spec.dig("source", "repoURL") == "https://github.com/Jahrough/platform-gitops.git"
            end
            cloud_root = YAML.load_file("argocd/bootstrap/root-app.yaml")
            exclusions = cloud_root.dig("spec", "source", "directory", "exclude")
            abort "Cloud root can discover local Applications" unless
              exclusions.include?("local/**")
          '

      - name: Render Kafka Connect resources
        run: |
          kubectl kustomize kubernetes/platform/cdc \
            > /tmp/product-cdc.yaml

      - name: Parse rendered manifests
        run: |
          ruby -e '
            require "yaml"
            ARGV.each { |file| YAML.load_stream(File.read(file)) }
            puts "Rendered manifests are valid YAML"
          ' /tmp/product-*.yaml

      - name: Test GitOps helper scripts
        run: python -m unittest discover -s tests -v
