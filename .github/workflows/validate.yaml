name: Validate GitOps manifests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0

      - name: Lint chart
        run: |
          helm lint charts/spring-service \
            -f charts/spring-service/values/product-catalog.yaml \
            -f charts/spring-service/values/environments/dev.yaml

      - name: Parse Argo CD, values, and provider manifests
        run: |
          ruby -e '
            require "yaml"
            files = Dir.glob("argocd/**/*.yaml") +
              Dir.glob("charts/spring-service/Chart.yaml") +
              Dir.glob("charts/spring-service/values/**/*.yaml") +
              Dir.glob("kubernetes/**/*.yaml")
            files.each { |file| YAML.load_file(file) }
            puts "Parsed #{files.length} YAML files"
          '

      - name: Render every service and environment
        run: |
          set -euo pipefail
          for service in product-catalog product-search; do
            for environment in dev staging production; do
              namespace="platform-${environment}"
              service_values="charts/spring-service/values/${service}.yaml"
              environment_values="charts/spring-service/values/environments/${environment}.yaml"
              helm template "$service" charts/spring-service \
                --namespace "$namespace" \
                --values "$service_values" \
                --values "$environment_values" \
                > "/tmp/${service}-${environment}.yaml"
            done
          done

      - name: Check production platform resources render
        run: |
          set -euo pipefail
          for service in product-catalog product-search; do
            rendered="/tmp/${service}-production.yaml"
            grep -q '^kind: HorizontalPodAutoscaler$' "$rendered"
            grep -q '^kind: PodDisruptionBudget$' "$rendered"
            grep -q '^kind: NetworkPolicy$' "$rendered"
            if grep -q '^kind: Ingress$' "$rendered"; then
              echo "Unexpected production ingress rendering." >&2
              exit 1
            fi
          done

      - name: Render Kafka Connect resources
        run: |
          kubectl kustomize kubernetes/platform/cdc \
            > /tmp/product-cdc.yaml

      - name: Parse rendered manifests
        run: |
          ruby -e '
            require "yaml"
            ARGV.each { |file| YAML.load_stream(File.read(file)) }
            puts "Rendered manifests are valid YAML"
          ' /tmp/product-*.yaml

      - name: Test GitOps helper scripts
        run: python -m unittest discover -s tests -v
